.art-1 {

.art-2 {

}
.art-3 {

}
.art-number {

.course-card-body {

}
.course-card-body .eyebrow {

}
.course-card h2 {

}
.course-card-body > p:not(.eyebrow) {

.course-meta {

}

.resource-grid {

}
.card-top {

  gap: 12px;
}
.card-top > small {

  color: #91a080;
}
.clamp {
  white-space: pre-line;

  -webkit-line-clamp: 3;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
.review-form {
  padding-top: 20px;
  margin-top: 22px;
  border-top: 1px solid #e3e9da;
}
.detail-panel {
  margin-top: 30px;
}
.detail-field {

}
.detail-field p {

  font-size: 13px;
}
.detail-field h3 {
  color: #536c46;
  font-size: 14px;
}
.prose {
  white-space: pre-wrap;
  line-height: 1.9;
  overflow-wrap: anywhere;
}
.narrow {
  max-width: 800px;
  margin-inline: auto;
}
.auth-wrap {
  display: grid;
  grid-template-columns: 1fr 1fr;
  max-width: 1050px;
  margin: 5px auto;
  min-height: 580px;
  border: 1px solid #e2e8da;
  border-radius: 16px;

}
.auth-intro {
  background: var(--green);

}
.auth-intro .eyebrow {
  color: #b7cba2;
}
.auth-intro h1 {
  font-size: 42px;

}
.auth-intro > p {
  color: #bfd0b6;
  font-size: 13px;
  line-height: 1.9;
}
.auth-promise {

  align-items: flex-start;
  gap: 12px;
  margin-top: 30px;

}
.auth-panel {
  padding: 42px;
}
.auth-panel h1 {
  font-size: 26px;
}
.auth-links {
  display: flex;

  gap: 12px;
  border-top: 1px solid #e4eadb;
  padding-top: 20px;
  margin-top: 25px;
}
.auth-links button {
  border: 0;
  background: none;
  color: #7b8e6b;
  font-size: 10px;
  padding: 0;
}
.success-card {
  padding: 25px;
  background: #eef3e7;
  border-radius: 9px;
  color: var(--green);
}
.success-card > svg {
  margin-bottom: 16px;
}
.tabs {
  display: flex;
  flex-wrap: wrap;
  gap: 7px;
  margin-bottom: 24px;
  padding-bottom: 17px;
  border-bottom: 1px solid #dfe6d6;
}
.tabs button {
  border: 1px solid #e2e8db;
  border-radius: 6px;
  background: #fff;
  padding: 9px 12px;
  font-size: 11px;
  color: #7e8d70;
}
.tabs button.active {
  background: var(--green);
  border-color: var(--green);
  color: white;
}
.upload {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  background: #f1f5eb;
  border: 1px dashed #cad8bf;
  border-radius: 7px;
  padding: 14px;
  font-size: 12px;
  color: #738c5e;
  cursor: pointer;
  width: fit-content;
  margin: 12px 0;
}
.upload input {
  max-width: 220px;
  font-size: 10px;
}
.cover-preview {
  max-width: 250px;
  max-height: 160px;
  object-fit: cover;
  border-radius: 6px;
}
.logo-preview {
  max-height: 70px;
  max-width: 200px;
  object-fit: contain;
  display: block;
  margin: 15px 0;
}
.lesson-content > h2 {
  font-size: 26px;
}
.learning-layout {
  display: grid;
  grid-template-columns: 260px minmax(0, 1fr);
  gap: 25px;
  margin-top: 30px;
}
.lesson-nav {
  align-self: start;
  position: sticky;
  top: 110px;
  padding: 22px;
}
.lesson-nav button {
  border: 0;
  background: none;
  border-radius: 6px;
  display: flex;
  gap: 10px;
  align-items: center;
  width: 100%;
  padding: 12px 10px;
  font-size: 11px;
  text-align: start;
  color: #839274;
}
.lesson-nav button.selected {
  background: #edf2e5;
  color: var(--green);
}
.lesson-nav h3 {
  font-size: 12px;
  margin: 22px 0 7px;
}
.lesson-nav h2 {
  font-size: 17px;
}
.lesson-nav > p {
  font-size: 10px;
}
.video {

  border: 0;
  border-radius: 8px;
  background: #eff3e9;
  margin: 20px 0;
}
.divider {
  height: 1px;
  background: #e5eadd;
  margin: 25px 0;
}
progress {
  width: 100%;
  height: 7px;
  border-radius: 6px;
  accent-color: var(--green);
  overflow: hidden;
  background: #edf1e6;
}
progress::-webkit-progress-bar {
  background: #e8eee0;
}
progress::-webkit-progress-value {
  background: var(--green);
  border-radius: 6px;
}
fieldset {
  border: 1px solid #e2e8d8;
  border-radius: 8px;
  padding: 20px;
  margin: 15px 0;
}
legend {
  font-size: 13px;
  color: #648051;
  padding: 0 7px;
}
.plain-fieldset {
  border: 0;
  margin: 0;
  padding: 0;
}
.score {
  font-size: 22px !important;
  color: var(--green) !important;
  margin-top: 20px;
}
.stepper {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 10px;
  margin: 20px 0 28px;
}
.stepper button {
  background: #fff;
  border: 1px solid #dce4d3;
  border-radius: 6px;
  display: flex;
  gap: 9px;
  align-items: center;
  text-align: start;
  font-size: 10px;
  padding: 11px;
  color: #82916f;
}
.stepper button span {
  height: 21px;
  width: 21px;
  border-radius: 50%;
  background: #edf2e5;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 10px;
  flex-shrink: 0;
}
.stepper button.active {
  border-color: var(--green);
  color: var(--green);
  background: #eaf0e2;
}
.stepper button.active span {
  background: var(--green);
  color: white;
}
.canvas-grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 16px;
}
.canvas-grid textarea {
  height: 160px;
}
.project-card {
  text-align: start;
  cursor: pointer;
}
.project-card > svg {
  color: #8eac75;
  margin-bottom: 20px;
}
.project-card .text-link {
  margin-top: 15px;
}
.month-inputs {
  display: grid;
  grid-template-columns: repeat(6, minmax(0, 1fr));
  gap: 13px;
}
.table-wrap {
  overflow-x: auto;
  margin: 20px 0;
}
table {
  width: 100%;
  border-collapse: collapse;
  white-space: nowrap;
}
th {
  text-align: start;
  font-size: 10px;
  font-weight: 600;
  color: #7a8f65;
  background: #f3f6ed;
  padding: 12px;
}
td {
  font-size: 11px;
  color: #7d906d;
  padding: 13px 12px;
  border-bottom: 1px solid #edf1e5;
  vertical-align: top;
}
td small {
  display: block;
  font-size: 9px;
  color: #a0ac93;
}
td code {
  font-size: 9px;
  color: #8da178;
}
.role-line {
  display: block;
  margin-bottom: 5px;
}
.role-list {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}
.mono,
code {
  font-family: monospace;
  font-size: 11px;
  overflow-wrap: anywhere;
  word-break: break-all;
}
.mfa-box {
  padding: 20px;
  background: #f3f6ee;
  margin-top: 20px;
  border-radius: 8px;
}
.mfa-box > img {
  width: 180px;
  max-width: 100%;
  display: block;
}
.mfa-box code {
  display: block;
  user-select: all;
  margin-bottom: 20px;
}
.bar-row {
  display: flex;
  align-items: center;
  gap: 14px;
  font-size: 11px;
  margin: 18px 0;
}
.bar-row > div {
  flex: 1;
  background: #edf1e6;
  height: 14px;
  border-radius: 3px;
  overflow: hidden;
}
.bar-row i {
  display: block;
  height: 100%;
  background: #8eab6e;
  border-radius: 3px;
}
.toast {
  position: fixed;
  bottom: 25px;
  inset-inline-end: 25px;
  z-index: 100;
  background: #174e3e;
  color: #fff;
  box-shadow: 0 7px 35px #143c2d30;
  border: 1px solid #6c8c5f;
  border-radius: 9px;
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 17px 20px;
  max-width: min(500px, 90vw);
  font-size: 13px;
}
.toast.error {
  background: #7d493d;
  border-color: #a77e62;
}
.toast button {
  background: none;
  border: 0;
  color: inherit;
  margin-inline-start: 12px;
  padding: 0;
}
.busy-line {
  position: fixed;
  top: 0;
  left: 0;
  height: 3px;
  width: 100%;
  background: #a7bf7f;
  z-index: 999;
  animation: pulse 1s infinite;
}
.connection-error {
  position: fixed;
  bottom: 20px;
  left: 20px;
  right: 20px;
  background: #7b493a;
  color: white;
  border-radius: 7px;
  padding: 15px;
  z-index: 90;
  font-size: 12px;
}
.connection-error button {
  margin: 0 15px;
  background: white;
  border: 0;
  padding: 8px;
  border-radius: 4px;
}
.spin {
  animation: spin 1s linear infinite;
}
details {
  margin-top: 20px;
}
summary {
  cursor: pointer;
  font-size: 12px;
  color: var(--green);
}
.readable-json {
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  font: inherit;
  color: #82926f;
}
.readable-json + h2 {
  font-size: 20px;
}
.panel .stat {
  padding: 16px;
}
.panel .stat strong {
  font-size: 23px;
}
@keyframes spin {
  to {
    transform: rotate(360deg);
  }
}
@keyframes pulse {
  50% {
    opacity: 0.3;
  }
}

  .workspace-main,
  .public-main {

  .sidebar {

  .panel {

  .tabs {

  .tabs button {

  .learning-layout {

  .lesson-nav {

  .lesson-content > h2 {

  }
  .month-inputs {
    grid-template-columns: repeat(3, minmax(0, 1fr));

  .stepper button {

  .toast {
    bottom: 15px;

    padding: 15px;

    padding: 25px;
    gap: 15px;
  }
  footer strong {
    width: 100%;
  }
  .course-art {

@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    animation: none !important;
    transition: none !important;
    scroll-behavior: auto !important;
  }
}
/* Adaptation autonome GitHub Pages : aucune API ni base de données. */
:root{--green:#12594b}
body{min-height:100vh}
.initial-loader{padding:8rem 2rem;text-align:center;font-weight:800;color:var(--green)}
.static-note{background:#f3f0e5;border:1px solid #e6dcc2;border-radius:9px;color:#645635;padding:14px 18px;margin:18px 0 26px;font-size:13px;line-height:1.7}
.static-note strong{color:#4f462f}
.public-main{min-height:55vh}
.static-container{max-width:1150px;margin:0 auto;padding:55px 28px 85px}
.static-header{max-width:800px;margin-bottom:30px}
.static-header h1{font-size:clamp(28px,3.5vw,43px)}
.static-header .lead{color:#61736b;font-size:16px;line-height:1.8}
.static-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
.static-grid.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.static-card{background:#fff;border:1px solid #e2e9df;border-radius:12px;padding:25px;box-shadow:0 8px 26px #17402a09;min-height:165px}
.static-card h2{font-size:18px;margin:12px 0 8px}
.static-card p{color:#64766b;margin-bottom:10px}
.static-card small{color:#758579}
.static-card .symbol{display:inline-flex;width:42px;height:42px;align-items:center;justify-content:center;border-radius:9px;background:#edf3ea;color:#12594b;font-size:22px}
.static-card .text-link{display:inline-flex;margin-top:10px;color:var(--green);font-weight:700}
.static-steps{counter-reset:step;display:grid;gap:12px;max-width:850px}
.static-step{background:white;border:1px solid #e1e9df;border-radius:10px;padding:18px 22px;display:flex;gap:17px;align-items:flex-start}
.static-step:before{counter-increment:step;content:counter(step,decimal-leading-zero);background:#e9f0e8;color:var(--green);padding:7px 12px;border-radius:8px;font-weight:800}
.static-step strong{display:block;margin-bottom:3px}
.static-step p{margin:0;color:#64766b}
.static-actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:24px}
.static-button{display:inline-flex;align-items:center;gap:7px;background:var(--green);color:white;border:1px solid var(--green);border-radius:8px;padding:11px 18px;font-weight:700;text-decoration:none;cursor:pointer}
.static-button.secondary{background:#fff;color:var(--green);border-color:#d8e2d8}
.static-button:hover{filter:brightness(.95)}
.static-button:focus-visible{outline:3px solid #b9a36f}
.static-tag{display:inline-block;font-size:11px;background:#eaf2e8;border-radius:999px;color:#12594b;padding:4px 10px;font-weight:700}
.static-panel{border:1px solid #dce5d8;background:#fff;border-radius:12px;padding:25px;margin-top:24px}
.static-panel h2{margin-bottom:10px}
.static-panel p{color:#65776a}
.static-choice{display:flex;align-items:flex-start;gap:10px;border:1px solid #dde7db;border-radius:8px;background:#fff;padding:14px 16px;margin:9px 0;cursor:pointer}
.static-choice input{accent-color:#12594b;margin-top:4px}
.static-result{border-left:4px solid #12594b;background:#f0f5ee;padding:18px;border-radius:0 8px 8px 0;margin-top:16px}
.static-result p{margin-bottom:0}
.static-faq details{background:white;border:1px solid #e1e9df;border-radius:10px;margin-bottom:10px;padding:17px 20px}
.static-faq summary{cursor:pointer;font-weight:700}
.static-faq details p{color:#627469;margin:10px 0 0}
.topbar-inner{flex-wrap:wrap}
.public-nav{gap:10px;flex-wrap:wrap}
.public-nav button.active{color:var(--green);font-weight:800}
.footer-links{display:flex;gap:15px;flex-wrap:wrap}
.hero .button{cursor:pointer}
.hero .journey-card{box-sizing:border-box}
[dir="rtl"] .static-result{border-left:0;border-right:4px solid #12594b;border-radius:8px 0 0 8px}
[dir="rtl"] .static-step{flex-direction:row}
@media(max-width:900px){.static-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.public-nav{width:100%;order:3;justify-content:center}.topbar-inner{gap:12px}}
@media(max-width:600px){.static-grid,.static-grid.two{grid-template-columns:1fr}.static-container{padding:30px 17px 60px}.static-card{min-height:0}.public-nav{gap:4px}.public-nav button{font-size:11px;padding:6px}.brand{font-size:18px}.digital{font-size:12px}.hero-inner{padding:38px 22px}.hero-proof{flex-wrap:wrap}.journey-visual{max-width:100%}.journey-card{max-width:calc(100% - 10px)}.static-header h1{font-size:29px}}


/* AFPEED - Accueil institutionnel 2026 (version GitHub Pages) */
.af-hero{background:linear-gradient(125deg,#eff7f2 0%,#ffffff 58%,#f6f3e9 100%);overflow:hidden}
.af-hero-grid{max-width:1360px;margin:auto;padding:76px 48px 72px;display:grid;grid-template-columns:minmax(0,1.02fr) minmax(0,.98fr);align-items:center;gap:58px}
.af-hero-copy{min-width:0}
.af-pill{display:inline-flex;align-items:center;gap:9px;padding:9px 14px;border:1px solid #cce2d6;background:#e7f4eb;border-radius:100px;color:#13614b;font-weight:800;font-size:11px;letter-spacing:.09em;margin-bottom:25px}
.af-pill-dot{width:8px;height:8px;background:#26a36e;border-radius:50%;box-shadow:0 0 0 4px #c9ecd8}
.af-hero h1{font-size:clamp(35px,4vw,60px);letter-spacing:-1.8px;line-height:1.13;color:#113d34;margin:0 0 17px;max-width:720px}
.af-hero-sub{font-size:17px;color:#17604f;font-weight:800;line-height:1.55;margin-bottom:18px;max-width:620px}
.af-intro-text{font-size:15px;line-height:1.9;color:#51675c;max-width:670px;margin-bottom:24px}
.af-hero-actions{display:flex;flex-wrap:wrap;gap:12px;margin-bottom:22px}
.af-primary,.af-secondary{display:inline-flex;align-items:center;justify-content:center;gap:13px;padding:13px 21px;border-radius:10px;font-weight:800;text-decoration:none;font-size:14px;transition:transform .15s,box-shadow .15s;cursor:pointer}
.af-primary{background:#126248;color:#fff;border:1px solid #126248;box-shadow:0 8px 20px #12624825}
.af-secondary{background:#fff;color:#165844;border:1px solid #cadbd0}
.af-primary:hover,.af-secondary:hover{transform:translateY(-2px);box-shadow:0 9px 20px #0b48321b}
.af-hero-meta{display:flex;flex-wrap:wrap;gap:10px;color:#426956;font-weight:700;font-size:12px}
.af-hero-meta span{padding:5px 10px;border-radius:20px;background:#e9f3ed}
.af-hero-photo{position:relative;margin:0;min-width:0;aspect-ratio:1.23;border-radius:23px;overflow:hidden;box-shadow:0 26px 55px #183b2e26;border:6px solid white;background:#dce9e1}
.af-hero-photo img{display:block;width:100%;height:100%;object-fit:cover;object-position:center}
.af-hero-photo figcaption{position:absolute;bottom:0;left:0;right:0;background:linear-gradient(transparent,#062e2adf);color:white;padding:50px 22px 22px;font-size:14px;font-weight:800;display:flex;align-items:center;gap:10px}
.af-photo-tag{background:#f3e5ad;color:#22523e;font-size:10px;border-radius:5px;padding:4px 7px}
.af-intro-strip{background:#124d3f;color:#e9f7ef}
.af-intro-strip-inner{max-width:1280px;margin:auto;padding:18px 30px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;text-align:center}
.af-intro-strip span{font-size:12px;font-weight:700;white-space:normal}
.af-section{max-width:1300px;margin:auto;padding:80px 48px}
.af-section-heading{max-width:790px;margin-bottom:34px}
.af-eyebrow{font-size:12px;letter-spacing:.14em;color:#21805e;font-weight:900;margin-bottom:12px}
.af-section-heading h2,.af-digital-head h2,.af-direction-copy h2,.af-contact h2{font-size:clamp(28px,3.3vw,43px);line-height:1.2;color:#133e34;letter-spacing:-1px;margin-bottom:15px}
.af-section-heading>p:last-child{font-size:15px;color:#65796c;line-height:1.8}
.af-goals-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
.af-goal{background:#fff;border:1px solid #e1e9e2;border-radius:16px;padding:25px;box-shadow:0 10px 35px #13482b08;min-height:206px}
.af-goal-icon{display:flex;width:43px;height:43px;border-radius:12px;align-items:center;justify-content:center;background:#e7f4eb;color:#18704e;font-size:23px;margin-bottom:15px}
.af-goal h3{font-size:17px;line-height:1.4;margin:0 0 9px;color:#1a4137}
.af-goal p{color:#667a6e;font-size:13px;line-height:1.8;margin:0}
.af-digital{max-width:none;background:#edf4ee;padding:75px max(28px,calc((100vw - 1200px)/2)) 82px}
.af-digital-head{display:flex;justify-content:space-between;align-items:end;gap:30px;max-width:1200px;margin:0 auto 28px}
.af-digital-head>p{max-width:340px;color:#617467;line-height:1.8}
.af-digital .landing-section{padding:0;max-width:1200px}
.af-digital .landing-section>.heading{display:none}
.af-digital .path-card{border-radius:16px;box-shadow:0 10px 26px #193e2611}
.af-direction-layout{display:grid;grid-template-columns:minmax(250px,.76fr) minmax(0,1.24fr);gap:68px;align-items:center}
.af-direction-photo{margin:0;max-width:390px;background:#fff;border:1px solid #e4e8de;border-radius:19px;overflow:hidden;box-shadow:0 20px 45px #153a2d18}
.af-direction-photo img{display:block;width:100%;aspect-ratio:4/4.1;object-fit:cover;object-position:center 10%}
.af-direction-photo figcaption{padding:14px 17px;font-size:12px;color:#526a5c;text-align:center;line-height:1.6}
.af-direction-copy>p:not(.af-eyebrow){font-size:16px;color:#60776a;line-height:1.9;max-width:670px;margin-bottom:22px}
.af-direction-tags{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:28px}
.af-direction-tags span{background:#e9f3ea;color:#176348;border-radius:30px;padding:8px 14px;font-weight:700;font-size:12px}
.af-contact{background:linear-gradient(110deg,#103f35,#176f53);color:#fff;scroll-margin-top:100px}
.af-contact-inner{max-width:1300px;margin:auto;padding:70px 48px 80px}
.af-contact .af-eyebrow{color:#b9e5c6}
.af-contact h2{color:#fff}
.af-contact-heading{max-width:800px;margin-bottom:26px}
.af-contact-heading>p:last-child{color:#d5e8dd;font-size:15px;line-height:1.7}
.af-contact-cards{display:grid;grid-template-columns:1fr 1fr 1.3fr;gap:15px}
.af-contact-card{min-width:0;display:flex;align-items:center;gap:13px;padding:20px 17px;background:#ffffff12;border:1px solid #ffffff36;border-radius:13px;color:#fff;text-decoration:none;transition:background .15s}
.af-contact-card:hover{background:#ffffff24}
.af-contact-icon{display:flex;align-items:center;justify-content:center;width:41px;height:41px;flex-shrink:0;background:#ffffff21;border-radius:10px;font-size:23px}
.af-contact-card>span:nth-child(2){min-width:0}
.af-contact-card small{display:block;color:#c6e2d4;font-size:11px}
.af-contact-card strong{font-size:clamp(12px,1.1vw,16px);overflow-wrap:anywhere}
.af-contact-arrow{margin-inline-start:auto;color:#cde7d6}
.af-home-note{padding-top:26px;padding-bottom:32px}
#af-objectifs{scroll-margin-top:95px}
[dir="rtl"] .af-hero h1,[dir="rtl"] .af-section h2,[dir="rtl"] .af-contact h2{letter-spacing:0}
[dir="rtl"] .af-hero-photo figcaption{left:0;right:0}
@media(max-width:1050px){
 .af-hero-grid{padding:55px 32px;gap:30px}
 .af-hero h1{font-size:clamp(32px,4vw,48px)}
 .af-section{padding:60px 30px}
 .af-direction-layout{gap:35px}
 .af-contact-inner{padding:58px 30px}
 .af-contact-cards{grid-template-columns:repeat(2,minmax(0,1fr))}
 .af-contact-card:last-child{grid-column:1/-1}
}
@media(max-width:760px){
 .af-hero-grid{grid-template-columns:1fr;padding:38px 20px 46px}
 .af-hero h1{font-size:clamp(32px,8vw,44px)}
 .af-hero-photo{aspect-ratio:1.55}
 .af-intro-strip-inner{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;padding:15px}
 .af-section{padding:50px 20px}
 .af-goals-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
 .af-goal{padding:18px;min-height:0}
 .af-digital{padding:48px 20px}
 .af-digital-head{display:block}
 .af-digital .three-grid{grid-template-columns:1fr}
 .af-direction-layout{grid-template-columns:1fr;gap:30px}
 .af-direction-photo{max-width:320px;margin:auto}
 .af-contact-inner{padding:52px 20px}
 .af-contact-cards{grid-template-columns:1fr}
 .af-contact-card:last-child{grid-column:auto}
}
@media(max-width:440px){
 .af-hero-actions{display:grid;grid-template-columns:1fr}
 .af-primary,.af-secondary{width:100%}
 .af-goals-grid{grid-template-columns:1fr}
 .af-intro-strip-inner{grid-template-columns:1fr 1fr}
 .af-hero-photo{aspect-ratio:1.12}
 .af-contact-card{padding:15px}
}

    [t('Mes réponses au questionnaire sont-elles enregistrées ?','هل يتم حفظ إجاباتي على الاستبيان؟'),t('Non. Le questionnaire d’orientation fonctionne dans votre navigateur, sans transmission à un serveur.','لا، يعمل استبيان التوجيه في متصفحك دون إرسال البيانات إلى خادم.')]
  ].map(([q,a])=>`<details><summary>${q}</summary><p>${a}</p></details>`).join('')}</div></div>`;}
  function legal(){return `<div class="static-container">${heading(t('INFORMATIONS','معلومات'),t('Confidentialité et limites du site','الخصوصية وحدود الموقع'))}<div class="static-panel"><h2>${t('À propos de cette édition','حول هذه النسخة')}</h2><p>${t('Cette édition publique a été adaptée à partir de l’interface fournie d’AFPEED DIGITAL. Elle ne contient ni base de données, ni authentification, ni formulaires de collecte de données personnelles.','تم تكييف هذه النسخة العامة من واجهة AFPEED DIGITAL المقدمة. لا تحتوي على قاعدة بيانات أو مصادقة أو استمارات لجمع البيانات الشخصية.')}</p><h2>${t('Données locales','البيانات المحلية')}</h2><p>${t('Le choix de langue peut être conservé dans le stockage local de votre navigateur. Le questionnaire d’orientation n’est pas sauvegardé. GitHub, en tant qu’hébergeur, peut traiter des données techniques de consultation selon ses propres règles.','يمكن حفظ اختيار اللغة محليا في متصفحك. لا يتم حفظ استبيان التوجيه. قد يعالج GitHub بيانات تقنية للزيارة وفق سياساته.')}</p><h2>${t('Documents officiels','الوثائق الرسمية')}</h2><p>${t('Les conditions d’utilisation et la politique de confidentialité officielles de la plateforme complète n’étaient pas présentes dans le ZIP transmis et ne sont pas reproduites ici.','شروط الاستخدام وسياسة الخصوصية الرسمية للمنصة الكاملة لم تكن ضمن الملف المرسل ولم يتم نسخها هنا.')}</p></div></div>`;}
  function render(){
    const view=current();
    document.documentElement.lang=lang;document.documentElement.dir=lang==='ar'?'rtl':'ltr';
    const pages={home,courses,projects,orientation,faq,legal};
    const content=pages[view]?pages[view]():simple(view);
    app.innerHTML=shell(view,content);
    document.title=`AFPEED DIGITAL — ${view==='home'?t('Accueil','الرئيسية'):view}`;
    app.querySelectorAll('[data-go]').forEach(el=>el.addEventListener('click',()=>go(el.dataset.go)));
    app.querySelectorAll('[data-scroll]').forEach(el=>el.addEventListener('click',()=>{
      const target=app.querySelector('#'+el.dataset.scroll);
      if(target) target.scrollIntoView({behavior:'smooth',block:'start'});
    }));
    app.querySelector('#language').addEventListener('click',()=>{lang=lang==='fr'?'ar':'fr';localStorage.setItem('afpeed-language',lang);render();});
    const btn=app.querySelector('#orientation-submit');
    if(btn)btn.addEventListener('click',()=>{
      const selected=app.querySelector('input[name="stage"]:checked');
      const output=app.querySelector('#orientation-result');
      if(!selected){output.innerHTML=`<div class="static-result">${t('Choisissez une situation pour continuer.','اختر وضعيتك للمتابعة.')}</div>`;return;}
      const messages={
        idea:[t('Commencez par définir le problème, votre solution et vos clients potentiels.','ابدأ بتحديد المشكلة والحل والزبائن المحتملين.'),'projects'],
        plan:[t('Structurez votre marché, vos coûts, votre offre et vos besoins de financement.','نظّم السوق والتكاليف والعرض واحتياجات التمويل.'),'projects'],
        company:[t('Identifiez vos besoins de développement et consultez les organismes compétents.','حدد احتياجات تطوير نشاطك واستشر الهيئات المختصة.'),'program'],
        learn:[t('Découvrez les thèmes de formation présentés dans cette édition.','اكتشف مواضيع التكوين المعروضة في هذه النسخة.'),'courses']
      };
      const [msg,target]=messages[selected.value];
      output.innerHTML=`<div class="static-result"><strong>${t('Votre prochaine étape','خطوتك القادمة')}</strong><p>${msg}</p><div class="static-actions"><button class="static-button secondary" data-result-go="${target}">${t('Continuer','متابعة')} →</button></div></div>`;
      output.querySelector('[data-result-go]').addEventListener('click',()=>go(target));
    });
  }
  window.addEventListener('hashchange',()=>{render();window.scrollTo(0,0);});
  render();
})();

</script>
</body>
</html>
